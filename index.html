<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitBuddy - AI Fitness Plan Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
         font-family: 'Roboto', sans-serif; color: #fff;
         background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.85)),
                     url('/static/images/gym.jpg') center/cover no-repeat, #111; }
  .card { background: rgba(20,20,20,.9); padding: 32px; border-radius: 16px; width: 100%; max-width: 440px;
          box-shadow: 0 8px 30px rgba(0,0,0,.6); margin: 20px; }
  h1 { margin: 0 0 4px; font-weight: 900; color: #ff5722; text-align: center; }
  p.sub { text-align: center; color: #bbb; margin: 0 0 20px; }
  label { display: block; margin: 12px 0 4px; font-weight: 700; }
  input, select { width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 16px; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px;
           background: #ff5722; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; transition: .2s; }
  button:hover { background: #e64a19; transform: translateY(-2px); }
  .error { background: #b71c1c; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
  .link { text-align: center; margin-top: 16px; }
  .link a { color: #ffab91; }
  @media (max-width: 480px) { .card { padding: 20px; } }
</style>
</head>
<body>
<div class="card">
  <h1>FitBuddy</h1>
  <p class="sub">AI Fitness Plan Generator</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form action="/generate-workout" method="post">
    <label>Username</label><input type="text" name="username" required>
    <label>User ID</label><input type="text" name="user_id" required>
    <label>Age</label><input type="number" name="age" min="10" max="100" required>
    <label>Weight (kg)</label><input type="number" name="weight" step="0.1" min="20" required>
    <label>Fitness Goal</label>
    <select name="goal" required>
      <option value="weight loss">Weight Loss</option>
      <option value="muscle gain">Muscle Gain</option>
      <option value="general wellness">General Wellness</option>
    </select>
    <label>Workout Intensity</label>
    <select name="intensity" required>
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button type="submit">Generate My Plan</button>
  </form>
  <div class="link"><a href="/view-all-users">Admin: View all users</a></div>
</div>
</body>
</html>
